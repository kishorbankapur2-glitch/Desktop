<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liquid Buttons</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}
body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: radial-gradient(circle at top left,#111,#000);
    overflow:hidden;
}
.container{
    display:flex;
    flex-direction:column;
    gap:25px;
    padding:50px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(50px);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:35px;
    box-shadow:0 0 40px rgba(255,255,255,0.05);
}
.btn{
    position:relative;
    width:260px;
    height:70px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(20px);
    color:#fff;
    font-size:24px;
    font-weight:700;
    cursor:pointer;
    overflow:hidden;
    transition:0.4s cubic-bezier(0.22,1,0.36,1);
    border:1px solid rgba(255,255,255,0.12);
}
.btn::before{
    content:'';
    position:absolute;
    top:-50%;
    left:-50%;
    width:200%;
    height:200%;
    background:conic-gradient(
        transparent,
        rgba(255,255,255,0.25),
        transparent 30%
    );
    animation:flow 4s linear infinite;
}
.btn span{
    position:relative;
    z-index:2;
}
.btn:hover{
    transform:translateY(-6px) scale(1.03);
    box-shadow:0 15px 35px rgba(255,255,255,0.08);
}
@keyframes flow{
    100%{
        transform:rotate(360deg);
    }
}
</style>
</head>
<body>

<div class="container">
    <button class="btn" onclick="openLink('https://www.zee5.com/b2b-consumption/0-1-6z5960660')"><span>1</span></button>
    <button class="btn" onclick="openLink('https://www.zee5.com/b2b-consumption/0-1-6z5960662')"><span>2</span></button>
    <button class="btn" onclick="openLink('https://www.zee5.com/b2b-consumption/0-1-6z5963873')"><span>3</span></button>
    <button class="btn" onclick="openLink('https://www.zee5.com/b2b-consumption/0-1-6z5963871')"><span>4</span></button>
</div>

<script>
function openLink(url){
    window.open(url, "_blank");
}
</script>

</body>
</html>
